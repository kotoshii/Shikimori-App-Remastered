include ':app'

// StorIO 3.0.1, vendored and patched for AndroidX. It lives under vendor/ only to keep the repo
// root readable - the gradle project paths stay ':storio-*', so nothing outside this file refers to
// where the directories actually sit.
[
        'storio-common',
        'storio-common-annotations-processor',
        'storio-sqlite',
        'storio-sqlite-annotations',
        'storio-sqlite-annotations-processor'
].each { name ->
    include ":$name"
    project(":$name").projectDir = new File(settingsDir, "vendor/$name")
}
