# Builds every pushed commit from a fresh checkout with no Gradle cache, so a pass means the repository
# alone builds: no file left uncommitted, no library that only a local cache still has. The release build
# is unsigned and only checked here; releases are built and signed in Android Studio.
name: Build

on:
  push:
    # every branch; not tags, which only name a commit that was already built
    branches: ['**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # pinned, so the image changes only when this line does. It has JDK 17 and the SDK platform 35 and
    # build-tools 35.0.0 the build uses (runner-images readme, 2026-11-04)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use JDK 17
        # what AGP 8 needs; the image's default, 25, is too new for Gradle 8.14
        run: echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"

      - name: Build debug and release, run the unit tests
        run: ./gradlew assembleDebug assembleRelease testDebugUnitTest --console=plain

      - name: Release gate
        # library files a broken ProGuard run dropped from the 0.8.9 release: KefirBB's configs and OkHttp's
        # public suffix list. Jsoup's entities were the third; since Jsoup 1.11 they live in a class
        run: |
          count=$(unzip -l app/build/outputs/apk/release/*.apk | grep -c "kefirsf\|publicsuffixes")
          echo "found $count of 5"
          test "$count" -eq 5

      - name: Screens named in XML survive R8
        # app:fragment names a class only in a string, so the shrinker removes it unless proguard-rules.pro
        # keeps it (0.9.0 shipped without HostingFilterFragment, under ProGuard); usage.txt lists a removed
        # class alone on its line
        run: |
          usage=app/build/outputs/mapping/release/usage.txt
          test -s "$usage"
          classes=$(grep -rhoP 'app:fragment="\K[^"]+' app/src/main/res | sort -u)
          test -n "$classes"
          removed=0
          for cls in $classes; do
            if grep -qxF "$cls" "$usage"; then
              echo "::error::R8 removed $cls: keep it in app/proguard-rules.pro"
              removed=1
            else
              echo "kept: $cls"
            fi
          done
          exit $removed
