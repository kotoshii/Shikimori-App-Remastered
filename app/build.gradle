apply from: '../dependencies.gradle'
apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-parcelize'
apply plugin: 'kotlin-kapt'

//The version. The name is the three numbers below; the code (versionCode) is a counter in version.properties: every
//build takes the stored number plus one, and a release build stores that number, so each release is one higher than
//the last one. What the advanced-build-version plugin did up to 1.7.3; its 3.0.0, the one for AGP 8, stored the number
//before reading it, so a release got the stored number plus two (P7-T16)
def versionMajor = 0
def versionMinor = 10
def versionPatch = 6
def appVersionName = "${versionMajor}.${versionMinor}.${versionPatch}"

def versionFile = file('version.properties')
def versionProps = new Properties()
versionFile.withInputStream { versionProps.load(it) }
def appVersionCode = (versionProps.getProperty('AI_VERSION_CODE') as int) + 1
//assembleRelease, Studio's signed apk, or any other task with "release" in its name
if (gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }) {
    versionProps.setProperty('AI_VERSION_CODE', appVersionCode as String)
    versionFile.withOutputStream { versionProps.store(it, null) }
}

println "config name: ${appVersionName}, code: ${appVersionCode}"

android {
    //the package of R and BuildConfig: AGP 8 reads it here, no longer from the manifest
    namespace = 'com.gnoemes.shikimori'
    compileSdk versions.compileSdk
    buildToolsVersion versions.buildTools

    buildFeatures {
        //a class per layout with a typed field per view id, in place of the synthetics (P7-T14)
        viewBinding = true
        //off by default since AGP 8; the api keys and the base url below are read from it
        buildConfig = true
    }

    defaultConfig {
        applicationId "com.gnoemes.shikimori"
        minSdk versions.minSdk
        targetSdk versions.targetSdk
        versionName appVersionName
        versionCode appVersionCode
        vectorDrawables.useSupportLibrary = true
        multiDexEnabled true
        manifestPlaceholders = [appLabel: "@string/app_name"]
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }

        debug {
            //another app id, so a debug build installs beside the release, with its own login, settings and database
            applicationIdSuffix ".debug"
            versionNameSuffix "-SNAPSHOT"
            manifestPlaceholders = [appLabel: "Shikimori (Debug)"]
        }
    }

    buildTypes.each {
        it.buildConfigField 'String', 'ShikimoriClientId', ShikimoriClientId
        it.buildConfigField 'String', 'ShikimoriClientSecret', ShikimoriClientSecret
        it.buildConfigField 'String', 'ShikimoriBaseUrl', ShikimoriBaseUrl
        it.buildConfigField 'String', 'KodikToken', KodikToken
    }

    //ShikimoriApp-v<version>-<build type>.apk, as the versioning plugin named it (until P7-T16)
    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "ShikimoriApp-v${appVersionName}-${variant.buildType.name}.apk"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packaging {
        resources {
            excludes += 'META-INF/atomicfu.kotlin_module'
        }
    }
}

//the same bytecode level as the Java code (compileOptions); Kotlin 2 would take the JDK's, 17
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8
    }
}

//Room writes each database version's schema into app/schemas: the record a later migration is written against
kapt {
    arguments {
        arg("room.schemaLocation", "$projectDir/schemas")
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:' + versions.androidx
    implementation 'androidx.constraintlayout:constraintlayout:' + versions.constraint
    implementation 'androidx.fragment:fragment:' + versions.androidxFragment
    implementation 'androidx.preference:preference:' + versions.androidxPrefs
    implementation 'androidx.core:core-ktx:' + versions.ktx
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:' + versions.androidx
    implementation 'com.google.android.material:material:' + versions.material
    implementation 'androidx.palette:palette:' + versions.androidx

    implementation "com.google.dagger:dagger-android:" + versions.dagger
    implementation "com.google.dagger:dagger-android-support:" + versions.dagger
    kapt "com.google.dagger:dagger-android-processor:" + versions.dagger
    kapt "com.google.dagger:dagger-compiler:" + versions.dagger

    implementation 'io.reactivex.rxjava2:rxandroid:' + versions.rxAndroid
    implementation "io.reactivex.rxjava2:rxjava:" + versions.rxJava

    implementation "com.squareup.retrofit2:retrofit:" + versions.retrofit
    implementation "com.squareup.retrofit2:converter-gson:" + versions.retrofit
    implementation "com.squareup.retrofit2:adapter-rxjava2:" + versions.retrofit
    implementation "com.squareup.okhttp3:okhttp:" + versions.okHttp
    implementation "com.squareup.okhttp3:logging-interceptor:" + versions.okHttp

    implementation "com.arello-mobile:moxy:" + versions.moxy
    kapt "com.arello-mobile:moxy-compiler:" + versions.moxy

    implementation "com.github.bumptech.glide:glide:" + versions.glide
    implementation "com.github.bumptech.glide:okhttp3-integration:" + versions.glide
    kapt "com.github.bumptech.glide:compiler:" + versions.glide

    implementation "com.google.code.gson:gson:" + versions.gson
    implementation 'net.danlew:android.joda:' + versions.jodaDateTime
    implementation 'ru.terrakok.cicerone:cicerone:' + versions.cicerone
    implementation 'com.afollestad.material-dialogs:core:' + versions.materialDialogs
    implementation 'com.afollestad.material-dialogs:input:' + versions.materialDialogs
    implementation 'com.afollestad.material-dialogs:files:' + versions.materialDialogs
    implementation 'com.afollestad.material-dialogs:datetime:' + versions.materialDialogs
    implementation 'com.github.ybq:Android-SpinKit:' + versions.spinKit
    implementation 'com.hannesdorfmann:adapterdelegates4:' + versions.adapterDelegate
    implementation 'com.google.android:flexbox:' + versions.flexbox
    implementation 'com.infideap.drawerbehavior:drawer-behavior:' + versions.drawerBehavior
    implementation 'com.facebook.shimmer:shimmer:' + versions.shimmer
    implementation 'de.hdodenhof:circleimageview:' + versions.circleImageView
    implementation 'ru.superjob:kotlin-permissions:' + versions.kotlinPermissions

    implementation 'com.google.android.exoplayer:exoplayer:' + versions.exoplayer
    implementation 'com.google.android.exoplayer:extension-mediasession:' + versions.exoplayer

    implementation 'org.kefirsf:kefirbb:' + versions.kefirBB

    implementation 'com.github.ome450901:SimpleRatingBar:' + versions.ratingBar
    implementation 'org.jsoup:jsoup:' + versions.jsoup

    implementation "androidx.room:room-runtime:" + versions.room
    implementation "androidx.room:room-rxjava2:" + versions.room
    kapt "androidx.room:room-compiler:" + versions.room

    implementation 'io.lindstrom:m3u8-parser:' + versions.m3u8Parser

    testImplementation 'junit:junit:' + versions.junit
}
