// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    apply from: './dependencies.gradle'

    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:' + versions.gradlePlugin
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:" + versions.kotlin
        classpath 'com.android.tools.build.jetifier:jetifier-processor:' + versions.jetifier
        classpath 'org.moallemi.gradle.advanced-build-version:gradle-plugin:' + versions.advancedVersioning
    }
}

allprojects {
    repositories {
        //libraries no public repository serves any more, kept here unchanged (vendor/maven/README.md)
        maven { url "$rootDir/vendor/maven" }
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
