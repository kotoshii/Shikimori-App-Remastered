android.useAndroidX=true
android.enableJetifier=true
# R8 in its ProGuard-compatible mode. Full mode, AGP 8's default, also drops constructors and generic
# signatures that nothing names, which Gson 2.8.5 and Retrofit 2.4 read by reflection with no rules of their own
android.enableR8.fullMode=false
# one R class with every library's resources in it, as before AGP 8: the code reads library resources
# through the app's R
android.nonTransitiveRClass=false