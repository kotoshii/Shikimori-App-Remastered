# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# 3 GB for faster builds: 1.5 GB is little for Kotlin and kapt (2026-11-14, not measured). The Kotlin
# daemon takes the same unless set apart: under 6 GB together, room for Studio and an emulator on 16 GB
org.gradle.jvmargs=-Xmx3g
